name: Publish to GitHub

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    env:
      GENERATED_CHANGELOG: /tmp/generated_changelog.txt
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Generate Changelog
        run: |
          python .github/workflows/generate-changelog.py > ${{ env.GENERATED_CHANGELOG }}
      - name: Compute Tag
        run: |
          RELEASE_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: ${{ env.GENERATED_CHANGELOG }}
          tag_name: ${{ env.RELEASE_TAG }}
